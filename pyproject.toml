[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-kyc-platform"
version = "0.9.0"
description = "Identity verification with document OCR, MRZ, face quality and 1:1 biometrics"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg2-binary>=2.9,<3",
  "uvicorn>=0.32,<1",
  "python-multipart>=0.0.18,<1",
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  "cryptography>=44,<47",
  "opencv-python-headless>=4.10,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kyc = ["web/capture/*"]
