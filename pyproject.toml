[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-kyc-platform"
version = "0.18.0"
description = "Identity verification with document OCR, MRZ, face quality and 1:1 biometrics"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1",
  "starlette>=1.3.1,<2",
  "anyio>=4.14.2,<5",
  "idna>=3.15,<4",
  "python-dotenv>=1.2.2,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg2-binary>=2.9,<3",
  "uvicorn>=0.32,<1",
  "python-multipart>=0.0.18,<1",
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  "cryptography>=50,<51",
  "zxing-cpp>=2.3,<4",
  "asn1crypto>=1.5,<2",
  "opencv-python-headless>=4.10,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kyc = ["web/capture/*", "web/review/*"]
