server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Document photos and liveness frame batches (MAX_LIVENESS_BYTES is 16 MiB).
    client_max_body_size 20m;
    server_tokens off;
    include /etc/nginx/snippets/kyc-security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API sets its own security headers; only these paths reach it.
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Inline Khmer + Latin OCR can take tens of seconds per card.
        proxy_read_timeout 180s;
    }

    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/kyc-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/kyc-security-headers.conf;
    }
}
